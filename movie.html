<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie — HDMOVIEZ</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#08090b;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

header{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
border-bottom:1px solid #22242a;
}

.logo{
color:#fff;
text-decoration:none;
font-weight:900;
font-size:22px;
letter-spacing:2px;
}

.back{
color:#aaa;
text-decoration:none;
font-size:14px;
}

main{
max-width:1100px;
margin:auto;
padding:55px 6%;
}

.movie{
display:grid;
grid-template-columns:280px 1fr;
gap:40px;
}

.poster{
height:410px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:linear-gradient(145deg,#292c33,#111216);
border:1px solid #292b31;
}

.label{
color:#888;
font-size:12px;
letter-spacing:2px;
margin-bottom:12px;
}

h1{
font-size:clamp(35px,6vw,60px);
margin-bottom:15px;
}

.meta{
color:#999;
line-height:1.8;
margin-bottom:25px;
}

.description{
color:#aaa;
line-height:1.7;
max-width:650px;
}

.watch-section{
margin-top:35px;
padding:25px;
border-radius:16px;
background:#121317;
border:1px solid #292b31;
}

.watch-section h2{
margin-bottom:10px;
}

.watch-section p{
color:#888;
font-size:14px;
margin-bottom:20px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:12px;
}

.button{
display:inline-block;
padding:13px 20px;
border-radius:10px;
background:#fff;
color:#111;
text-decoration:none;
font-weight:bold;
font-size:13px;
}

.note{
margin-top:15px;
color:#666;
font-size:11px;
}

.similar{
margin-top:60px;
}

.similar-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
margin-top:20px;
}

.card{
padding:20px;
background:#121317;
border:1px solid #25272c;
border-radius:14px;
text-align:center;
}

.small-poster{
height:170px;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
background:#202228;
border-radius:10px;
margin-bottom:12px;
}

.card h3{
font-size:14px;
}

footer{
margin-top:50px;
padding:40px 20px;
text-align:center;
border-top:1px solid #22242a;
color:#777;
font-size:12px;
}

@media(max-width:700px){

main{
padding:40px 5%;
}

.movie{
grid-template-columns:1fr;
gap:25px;
}

.poster{
height:380px;
}
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
HDMOVIEZ
</a>

<a href="index.html" class="back">
← Back
</a>

</header>


<main>

<div class="movie">

<div class="poster" id="poster">
🎬
</div>

<div>

<div class="label">
MOVIE DETAILS
</div>

<h1 id="title">
Loading...
</h1>

<div class="meta" id="meta"></div>

<p class="description" id="description"></p>


<div class="watch-section">

<h2>Where to Watch</h2>

<p>
Choose an authorized source to watch this movie.
</p>

<div class="buttons">

<a
id="freeLink"
href="#"
class="button"
target="_blank"
rel="noopener noreferrer">
🟢 Watch Free
</a>

<a
id="officialLink"
href="#"
class="button"
target="_blank"
rel="noopener noreferrer">
📺 Official Platform
</a>

</div>

<div class="note">
Only verified authorized/legal sources should be added.
</div>

</div>

</div>

</div>


<section class="similar">

<h2>Similar Movies</h2>

<div class="similar-grid">

<div class="card">
<div class="small-poster">🎬</div>
<h3>Coming Soon</h3>
</div>

<div class="card">
<div class="small-poster">🎬</div>
<h3>Coming Soon</h3>
</div>

<div class="card">
<div class="small-poster">🎬</div>
<h3>Coming Soon</h3>
</div>

</div>

</section>

</main>


<footer>

<strong>HDMOVIEZ</strong>

<p style="margin-top:10px;">
Har Movie, Ek Jagah.
</p>

</footer>


<script>

/*
=====================================
HDMOVIEZ MOVIE DATABASE
=====================================
Add new movies inside this object.
*/

const movies = {

movie1: {
title: "Sample Movie",
year: "2025",
language: "Hindi",
genre: "Drama",
rating: "—",
runtime: "—",
description:
"This is a sample movie entry for the HDMOVIEZ website.",
poster: "🎬",
free: "",
official: ""
},

movie2: {
title: "Sample Movie 2",
year: "2024",
language: "English",
genre: "Action",
rating: "—",
runtime: "—",
description:
"This is another sample movie entry.",
poster: "🎬",
free: "",
official: ""
},

movie3: {
title: "Sample Movie 3",
year: "2023",
language: "Tamil",
genre: "Comedy",
rating: "—",
runtime: "—",
description:
"This is a sample movie entry.",
poster: "🎬",
free: "",
official: ""
},

movie4: {
title: "Sample Movie 4",
year: "2023",
language: "Telugu",
genre: "Family",
rating: "—",
runtime: "—",
description:
"This is a sample movie entry.",
poster: "🎬",
free: "",
official: ""
}

};


/*
=====================================
GET MOVIE ID FROM URL
=====================================
*/

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id") || "movie1";


/*
=====================================
LOAD MOVIE
=====================================
*/

const movie =
movies[id];


if(movie){

document.getElementById("title").textContent =
movie.title;

document.getElementById("meta").innerHTML =
`${movie.year} • ${movie.language} • ${movie.genre}<br>
⭐ Rating: ${movie.rating} • Runtime: ${movie.runtime}`;

document.getElementById("description").textContent =
movie.description;

document.getElementById("poster").textContent =
movie.poster;


/*
LEGAL WATCH LINKS
*/

if(movie.free){

document.getElementById("freeLink").href =
movie.free;

}else{

document.getElementById("freeLink").style.display =
"none";

}


if(movie.official){

document.getElementById("officialLink").href =
movie.official;

}else{

document.getElementById("officialLink").style.display =
"none";

}

}else{

document.getElementById("title").textContent =
"Movie Not Found";

document.getElementById("description").textContent =
"Sorry, this movie could not be found.";

}

</script>

</body>
</html>
