<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HDMOVIEZ — Movie</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#08090b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    border-bottom:1px solid #22242a;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.back{
    color:#aaa;
    text-decoration:none;
}

main{
    max-width:1100px;
    margin:auto;
    padding:55px 6%;
}

.movie{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:40px;
}

.poster{
    height:410px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    background:linear-gradient(145deg,#292c33,#111216);
    border:1px solid #292b31;
}

.label{
    color:#888;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:12px;
}

h1{
    font-size:clamp(35px,6vw,60px);
    margin-bottom:15px;
}

.meta{
    color:#999;
    line-height:1.8;
    margin-bottom:25px;
}

.description{
    color:#aaa;
    line-height:1.7;
    max-width:650px;
}

.watch-section{
    margin-top:35px;
    padding:25px;
    border-radius:16px;
    background:#121317;
    border:1px solid #292b31;
}

.watch-section h2{
    margin-bottom:18px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:18px;
}

.button{
    display:inline-block;
    padding:13px 20px;
    border-radius:10px;
    background:#fff;
    color:#111;
    text-decoration:none;
    font-weight:bold;
    font-size:13px;
}

.note{
    margin-top:18px;
    color:#666;
    font-size:11px;
    line-height:1.5;
}

.similar{
    margin-top:60px;
}

.similar-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
    margin-top:20px;
}

.card{
    padding:20px;
    background:#121317;
    border:1px solid #25272c;
    border-radius:14px;
    text-align:center;
}

.small-poster{
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    background:#202228;
    border-radius:10px;
    margin-bottom:12px;
}

.card h3{
    font-size:14px;
}

footer{
    margin-top:50px;
    padding:40px 20px;
    text-align:center;
    border-top:1px solid #22242a;
    color:#777;
    font-size:12px;
}

@media(max-width:700px){

    main{
        padding:40px 5%;
    }

    .movie{
        grid-template-columns:1fr;
        gap:25px;
    }

    .poster{
        height:380px;
    }
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
HDMOVIEZ
</a>

<a href="index.html" class="back">
← Back
</a>

</header>


<main>

<div class="movie">

<div class="poster" id="poster">
🎬
</div>


<div>

<div class="label">
MOVIE DETAILS
</div>

<h1 id="title">
Loading...
</h1>

<div class="meta" id="meta"></div>

<p class="description" id="description"></p>


<div class="watch-section">

<h2>Where to Watch</h2>

<div id="statusBox"></div>

<div class="buttons" id="watchButtons"></div>

<div class="note">
HDMOVIEZ links only to authorized viewing sources.
Availability may change by region and time.
</div>

</div>

</div>

</div>


<section class="similar">

<h2>Similar Movies</h2>

<div class="similar-grid">

<div class="card">
<div class="small-poster">🎬</div>
<h3>Coming Soon</h3>
</div>

<div class="card">
<div class="small-poster">🎬</div>
<h3>Coming Soon</h3>
</div>

<div class="card">
<div class="small-poster">🎬</div>
<h3>Coming Soon</h3>
</div>

</div>

</section>

</main>


<footer>

<strong>HDMOVIEZ</strong>

<p style="margin-top:10px;">
Har Movie, Ek Jagah.
</p>

</footer>


<script>

const movies = {

movie1:{
title:"Iron Man",
year:"2008",
language:"English",
genre:"Action • Sci-Fi",
rating:"7.9",
runtime:"126 min",
status:"PAID",
source:"JioHotstar",
sourceUrl:"https://www.hotstar.com/in",
description:"Tony Stark, a billionaire industrialist, builds a powered suit of armor and becomes Iron Man.",
poster:"🤖"
},

movie2:{
title:"Dhurandhar",
year:"2025",
language:"Hindi",
genre:"Action • Thriller",
rating:"—",
runtime:"—",
status:"PAID",
source:"JioHotstar",
sourceUrl:"https://www.hotstar.com/in",
description:"Dhurandhar is an Indian action thriller.",
poster:"🎬"
},

movie3:{
title:"Deewaar",
year:"1975",
language:"Hindi",
genre:"Action • Crime • Drama",
rating:"—",
runtime:"168 min",
status:"FREE",
source:"Official Shemaroo YouTube",
sourceUrl:"https://www.youtube.com/watch?v=xuOQqWU2UQA",
description:"A classic Hindi crime drama starring Amitabh Bachchan and Shashi Kapoor.",
poster:"🎞️"
},

movie4:{
title:"Avtaar",
year:"1983",
language:"Hindi",
genre:"Drama",
rating:"—",
runtime:"150 min",
status:"PAID",
source:"ShemarooMe",
sourceUrl:"https://www.shemaroome.com/bollywood/movies/avtaar",
description:"A hardworking father faces difficult circumstances and struggles to rebuild his life.",
poster:"🎬"
},

movie5:{
title:"The Odyssey",
year:"2026",
language:"English",
genre:"Epic • Adventure • Drama",
rating:"—",
runtime:"—",
status:"THEATRICAL",
source:"",
sourceUrl:"",
description:"Christopher Nolan's epic adaptation of Homer's The Odyssey.",
poster:"🏛️"
}

};


const params =
new URLSearchParams(window.location.search);

const id =
params.get("id") || "movie1";

const movie =
movies[id];


if(movie){

document.getElementById("title").textContent =
movie.title;

document.getElementById("meta").innerHTML =
`${movie.year} • ${movie.language} • ${movie.genre}<br>
⭐ Rating: ${movie.rating} • Runtime: ${movie.runtime}`;

document.getElementById("description").textContent =
movie.description;

document.getElementById("poster").textContent =
movie.poster;


const statusBox =
document.getElementById("statusBox");

const watchButtons =
document.getElementById("watchButtons");


if(movie.status === "FREE"){

statusBox.innerHTML =
`<div style="color:#7cff9b;font-weight:bold;">
🟢 FREE TO WATCH
</div>
<p style="color:#888;margin-top:10px;">
Source: ${movie.source}
</p>`;

watchButtons.innerHTML =
`<a href="${movie.sourceUrl}"
class="button"
target="_blank"
rel="noopener noreferrer">
WATCH NOW
</a>`;

}


else if(movie.status === "PAID"){

statusBox.innerHTML =
`<div style="color:#ffd166;font-weight:bold;">
🟡 PAID / SUBSCRIPTION
</div>
<p style="color:#888;margin-top:10px;">
Source: ${movie.source}
</p>`;

watchButtons.innerHTML =
`<a href="${movie.sourceUrl}"
class="button"
target="_blank"
rel="noopener noreferrer">
VIEW OFFICIAL SOURCE
</a>`;

}


else if(movie.status === "THEATRICAL"){

statusBox.innerHTML =
`<div style="color:#9ecbff;font-weight:bold;">
🎬 THEATRICAL
</div>
<p style="color:#888;margin-top:10px;">
Official streaming information will be added when available.
</p>`;

watchButtons.innerHTML = "";

}

}


else{

document.getElementById("title").textContent =
"Movie Not Found";

document.getElementById("description").textContent =
"This movie could not be found.";

}

</script>

</body>
</html>
