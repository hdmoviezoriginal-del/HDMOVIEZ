<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HDMOVIEZ — Movie</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#08090b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}


/* HEADER */

header{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    border-bottom:1px solid #22242a;
    background:#08090b;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.back{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
}

.back:hover{
    color:#fff;
}


/* MAIN */

main{
    max-width:1100px;
    margin:auto;
    padding:55px 6%;
}


/* MOVIE */

.movie{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:40px;
}

.poster{
    height:410px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    background:
    linear-gradient(
        145deg,
        #292c33,
        #111216
    );
    border:1px solid #292b31;
    overflow:hidden;
}

.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* DETAILS */

.label{
    color:#888;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:12px;
}

h1{
    font-size:clamp(35px,6vw,60px);
    margin-bottom:15px;
}

.meta{
    color:#999;
    line-height:1.8;
    margin-bottom:25px;
}

.description{
    color:#aaa;
    line-height:1.7;
    max-width:650px;
}


/* WATCH */

.watch-section{
    margin-top:35px;
    padding:25px;
    border-radius:16px;
    background:#121317;
    border:1px solid #292b31;
}

.watch-section h2{
    margin-bottom:18px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:18px;
}

.button{
    display:inline-block;
    padding:13px 20px;
    border-radius:10px;
    background:#fff;
    color:#111;
    text-decoration:none;
    font-weight:bold;
    font-size:13px;
}

.button:hover{
    opacity:.85;
}

.note{
    margin-top:18px;
    color:#666;
    font-size:11px;
    line-height:1.5;
}


/* SIMILAR */

.similar{
    margin-top:60px;
}

.similar-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.similar-header h2{
    font-size:25px;
}

.similar-header span{
    color:#777;
    font-size:12px;
}

.similar-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
}


/* SIMILAR CARD */

.card{
    background:#121317;
    border:1px solid #25272c;
    border-radius:14px;
    overflow:hidden;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#555;
}

.small-poster{
    height:210px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    background:
    linear-gradient(
        145deg,
        #292c33,
        #111216
    );
    overflow:hidden;
}

.small-poster img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-info{
    padding:12px;
}

.card h3{
    font-size:14px;
    margin-bottom:6px;
}

.card-meta{
    color:#777;
    font-size:11px;
    line-height:1.5;
}

.card-button{
    display:block;
    margin-top:10px;
    padding:9px;
    border-radius:8px;
    background:#fff;
    color:#111;
    text-decoration:none;
    text-align:center;
    font-size:11px;
    font-weight:bold;
}


/* NO SIMILAR */

.no-similar{
    color:#666;
    padding:25px 0;
    font-size:13px;
}


/* FOOTER */

footer{
    margin-top:50px;
    padding:40px 20px;
    text-align:center;
    border-top:1px solid #22242a;
    color:#777;
    font-size:12px;
}

footer strong{
    color:#fff;
    font-size:20px;
    letter-spacing:1px;
}


/* TABLET / MOBILE */

@media(max-width:700px){

    header{
        padding:0 5%;
    }

    main{
        padding:40px 5%;
    }

    .movie{
        grid-template-columns:1fr;
        gap:25px;
    }

    .poster{
        height:380px;
        max-width:320px;
        width:100%;
        margin:auto;
    }

    .movie-info{
        width:100%;
    }

    h1{
        font-size:42px;
    }

    .similar{
        margin-top:45px;
    }

    .similar-grid{
        grid-template-columns:
        repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .small-poster{
        height:220px;
    }

}


/* VERY SMALL DEVICES */

@media(max-width:380px){

    .similar-grid{
        grid-template-columns:
        repeat(2,minmax(0,1fr));
    }

    .small-poster{
        height:190px;
    }

}

</style>

</head>


<body>


<header>

<a
href="index.html"
class="logo">
HDMOVIEZ
</a>

<a
href="index.html"
class="back">
← Back
</a>

</header>


<main>


<!-- MOVIE DETAILS -->

<div class="movie">


<div
class="poster"
id="poster">
🎬
</div>


<div class="movie-info">

<div class="label">
MOVIE DETAILS
</div>


<h1 id="title">
Loading...
</h1>


<div
class="meta"
id="meta">
</div>


<p
class="description"
id="description">
</p>


<!-- WATCH -->

<div class="watch-section">

<h2>
Where to Watch
</h2>


<div
id="statusBox">
</div>


<div
class="buttons"
id="watchButtons">
</div>


<div class="note">
HDMOVIEZ links only to authorized viewing
sources. Availability may change by region
and time.
</div>

</div>


</div>

</div>


<!-- SIMILAR MOVIES -->

<section class="similar">


<div class="similar-header">

<h2>
Similar Movies
</h2>

<span id="similarCount">
</span>

</div>


<div
class="similar-grid"
id="similarGrid">
</div>


</section>


</main>


<footer>

<strong>
HDMOVIEZ
</strong>

<p style="margin-top:10px;">
Har Movie, Ek Jagah.
</p>

</footer>


<!-- MOVIE DATABASE -->

<script src="movies.js"></script>


<script>


/* GET MOVIE ID */

const params =
new URLSearchParams(
    window.location.search
);

const id =
params.get("id");


/* FIND MOVIE */

const movie =
movies.find(
    item => item.id === id
);


/* ELEMENTS */

const title =
document.getElementById("title");

const meta =
document.getElementById("meta");

const description =
document.getElementById("description");

const poster =
document.getElementById("poster");

const statusBox =
document.getElementById("statusBox");

const watchButtons =
document.getElementById("watchButtons");

const similarGrid =
document.getElementById("similarGrid");

const similarCount =
document.getElementById("similarCount");


/* IMAGE CHECK */

function isImage(path){

    return(
        typeof path === "string" &&
        (
            path.endsWith(".jpg") ||
            path.endsWith(".jpeg") ||
            path.endsWith(".png") ||
            path.endsWith(".webp")
        )
    );

}


/* SHOW MOVIE */

if(movie){

    document.title =
    `HDMOVIEZ — ${movie.title}`;


    title.textContent =
    movie.title;


    meta.innerHTML =
    `
    ${movie.year} •
    ${movie.language} •
    ${movie.genres.join(" • ")}
    <br>
    ⭐ Rating: ${movie.rating}
    • Runtime: ${movie.runtime}
    `;


    description.textContent =
    movie.description;


    /* POSTER */

    if(isImage(movie.poster)){

        poster.innerHTML =
        `
        <img
        src="${movie.poster}"
        alt="${movie.title} poster">
        `;

    }

    else{

        poster.textContent =
        movie.poster;

    }


    /* WATCH STATUS */

    if(movie.status === "FREE"){

        statusBox.innerHTML =
        `
        <div
        style="
        color:#7cff9b;
        font-weight:bold;">
        🟢 FREE TO WATCH
        </div>

        <p
        style="
        color:#888;
        margin-top:10px;">
        Source: ${movie.source}
        </p>
        `;


        if(movie.sourceUrl){

            watchButtons.innerHTML =
            `
            <a
            href="${movie.sourceUrl}"
            class="button"
            target="_blank"
            rel="noopener noreferrer">

            WATCH NOW

            </a>
            `;

        }

    }


    else if(movie.status === "PAID"){

        statusBox.innerHTML =
        `
        <div
        style="
        color:#ffd166;
        font-weight:bold;">
        🟡 PAID / SUBSCRIPTION
        </div>

        <p
        style="
        color:#888;
        margin-top:10px;">
        Source: ${movie.source}
        </p>
        `;


        if(movie.sourceUrl){

            watchButtons.innerHTML =
            `
            <a
            href="${movie.sourceUrl}"
            class="button"
            target="_blank"
            rel="noopener noreferrer">

            VIEW OFFICIAL SOURCE

            </a>
            `;

        }

    }


    else if(movie.status === "THEATRICAL"){

        statusBox.innerHTML =
        `
        <div
        style="
        color:#9ecbff;
        font-weight:bold;">
        🎬 THEATRICAL
        </div>

        <p
        style="
        color:#888;
        margin-top:10px;">
        Official streaming information
        will be added when available.
        </p>
        `;

    }


    /* SIMILAR MOVIES */

    const currentGenres =
    movie.genres || [];


    const currentLanguage =
    movie.language;


    const similarMovies =
    movies
    .filter(
        item => item.id !== movie.id
    )
    .map(function(item){

        let score = 0;


        /* SAME GENRE = STRONG MATCH */

        const sharedGenres =
        item.genres.filter(
            genre =>
            currentGenres.includes(genre)
        ).length;


        score +=
        sharedGenres * 10;


        /* SAME LANGUAGE */

        if(
            item.language ===
            currentLanguage
        ){

            score += 5;

        }


        /* SAME YEAR RANGE */

        if(
            Math.abs(
                Number(item.year) -
                Number(movie.year)
            ) <= 5
        ){

            score += 1;

        }


        return {
            movie:item,
            score:score
        };

    })
    .filter(
        item => item.score > 0
    )
    .sort(
        (a,b) =>
        b.score - a.score
    )
    .slice(0,10)
    .map(
        item => item.movie
    );


    /* SHOW SIMILAR */

    similarCount.textContent =
    similarMovies.length
    ? `${similarMovies.length} recommendations`
    : "";


    if(similarMovies.length === 0){

        similarGrid.innerHTML =
        `
        <div class="no-similar">
        No similar movies available yet.
        </div>
        `;

    }


    else{

        similarMovies.forEach(
            function(item){

                const card =
                document.createElement("div");

                card.className =
                "card";


                let smallPoster;


                if(isImage(item.poster)){

                    smallPoster =
                    `
                    <img
                    src="${item.poster}"
                    alt="${item.title} poster"
                    loading="lazy">
                    `;

                }

                else{

                    smallPoster =
                    item.poster;

                }


                card.innerHTML =
                `
                <div class="small-poster">
                    ${smallPoster}
                </div>

                <div class="card-info">

                    <h3>
                    ${item.title}
                    </h3>

                    <div class="card-meta">
                    ${item.year} •
                    ${item.language}
                    </div>

                    <a
                    href="movie.html?id=${item.id}"
                    class="card-button">

                    VIEW DETAILS

                    </a>

                </div>
                `;


                similarGrid.appendChild(card);

            }
        );

    }

}


/* MOVIE NOT FOUND */

else{

    document.title =
    "HDMOVIEZ — Movie Not Found";


    title.textContent =
    "Movie Not Found";


    meta.textContent =
    "";


    description.textContent =
    "This movie could not be found.";


    similarGrid.innerHTML =
    `
    <div class="no-similar">
    Please return to the movies page
    and select a valid movie.
    </div>
    `;

}

</script>


</body>

</html>
